# Tests select this config explicitly, never the developer's ignored application.properties.
spring.application.name=projile-auth-tests
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.contexts=auth-tests
spring.mail.host=127.0.0.1
spring.mail.port=1
app.auth.frontend-url=http://localhost:4200
app.auth.mail-from=noreply@projile.test
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
server.servlet.session.tracking-modes=cookie
spring.main.banner-mode=off
logging.level.root=WARN
# The mail transport is a test double, not an SMTP health-check target.
management.health.mail.enabled=false
